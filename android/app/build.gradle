// build.gradle del mÃ³dulo Android de BotMp3 (estilo moderno con plugins DSL).
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    // Lint de release bloqueaba el empaquetado (AndroidLintTask); se desactiva.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    namespace = "com.botmp3.app"
    // Se usan las versiones del SDK ya instaladas en el equipo (platform 36 y
    // build-tools 36) para no descargar paquetes adicionales.
    compileSdk = 36
    ndkVersion = "27.2.12479018"
    buildToolsVersion = "36.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.botmp3.app"
        // Android 13+ (API 33) es el objetivo recomendado; se admite desde API 24.
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // POCO X7 Pro = arm64; se aÃ±aden 32 bits y x86_64 para emulador/otros equipos.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        // La firma solo se aplica si el keystore existe en el equipo local.
        // F-Droid (y cualquier build desde el repositorio publico) compila sin
        // el keystore: el APK sale sin firmar y F-Droid lo firma con su clave.
        release {
            // Las contrasenas NO van en el repositorio: se leen de
            // android/key.properties (ignorado por git). Si el archivo o el
            // keystore no existen, el APK sale sin firmar (F-Droid lo firma).
            def keyProps = new Properties()
            def keyPropsFile = rootProject.file("key.properties")
            if (keyPropsFile.exists()) {
                keyPropsFile.withInputStream { keyProps.load(it) }
            }
            if (file("botmp3-release.jks").exists() && keyProps.getProperty("storePassword")) {
                storeFile = file("botmp3-release.jks")
                storePassword = keyProps.getProperty("storePassword")
                keyAlias = keyProps.getProperty("keyAlias") ?: "botmp3"
                keyPassword = keyProps.getProperty("keyPassword")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.debug
        }
        release {
            if (file("botmp3-release.jks").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
