Builds:
  - versionName: 1.9.58
    versionCode: 111
    commit: v1.9.57
    subdir: BotMp3
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - cd $$flutter$$/bin && ./flutter config --no-analytics
      - cd $$flutter$$/bin && ./flutter precache --android
      - export PUB_CACHE=$$flutter$$/.pub-cache
      - cd $$flutter$$/bin && ./flutter pub get
    build:
      - export PUB_CACHE=$$flutter$$/.pub-cache
      - cd $$flutter$$/bin && ./flutter build apk --release --target-platform android-arm64 --no-pub

MaintainerNotes: |
  Build sin red: se hace pub get dentro del srclib de Flutter.
  Firmado por F-Droid (no usa el keystore del autor).
  Sin dependencias propietarias: solo Flutter + plugins open source.

