AutoName: BotMp3

Summary: Reproductor de musica offline con DJ de IA
Description: |-
  Reproductor de musica 100% offline con tema oscuro Liquid Glass.

  Incluye listas propias, cola de reproduccion, aleatorio sin repeticiones,
  ranking de canciones y generos, letras (.lrc), volumen por cancion, modo
  coche, gestos, widget de pantalla de inicio, copias de seguridad automaticas
  y un DJ con IA opcional (con la clave del propio usuario).

  No pide cuenta, no incluye anuncios ni rastreadores: la musica nunca sale del
  telefono. Solo usa internet si el usuario lo pide (IA o abrir una lista de
  tendencias en el navegador).

