Builds:
  - versionName: 1.9.135
    versionCode: 191
    commit: 70783b0f5526baf7fa831d19fc8a8898c9ab961e
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - test
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r27c

MaintainerNotes: |-
  Flutter app. Built and verified with Flutter 3.47.7, Dart 3.13.5, AGP 8.11.1,
  Kotlin 2.2.20, Gradle 8.14.3, NDK r27c, compileSdk 36, minSdk 24.
  All dependencies are FOSS (MIT/BSD/Apache). No ads, analytics or Google
  services. AI features are optional and need the user's own API key (NonFreeNet).
  Release signing is conditional: without the author's keystore the APK is
  built unsigned, so F-Droid signs it with its own key.

