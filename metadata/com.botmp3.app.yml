Builds:
  - versionName: 1.9.132
    versionCode: 188
    commit: v1.9.132
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.7
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64 --no-pub
    ndk: r27c

MaintainerNotes: |-
  Aplicacion Flutter. Compilada y verificada con Flutter 3.47.7, Dart 3.13.5,
  AGP 8.11.1, Kotlin 2.2.20, Gradle 8.14.3, NDK r27c, compileSdk 36, minSdk 24.
  Todas las dependencias son libres (MIT/BSD/Apache). Sin anuncios, analitica
  ni servicios de Google. Las funciones de IA son opcionales (NonFreeNet).

