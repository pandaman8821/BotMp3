# Receta de compilacion para fdroiddata (repositorio oficial de F-Droid).
# Copiar como metadata/com.botmp3.app.yml dentro de un clon de
# https://gitlab.com/fdroid/fdroiddata y validar con:
#     fdroid lint com.botmp3.app
#     fdroid build --server com.botmp3.app

